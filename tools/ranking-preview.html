<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>排行榜运行时预览</title>
<style>body{margin:0;background:#293a2d;display:flex;gap:24px;align-items:flex-start;padding:20px;font:14px sans-serif;color:white}section{display:grid;gap:8px}canvas{background:#fff}</style>
<section><b>世界榜 414×896</b><canvas id="large" width="414" height="896"></canvas></section>
<section><b>好友榜 320×568</b><canvas id="small" width="320" height="568"></canvas></section>
<script type="module">
import { FriendsPage } from '../src/pages/friends/index.js';
import { createViewport } from '../src/core/viewport.js';
function mount(id, width, height, tab) {
  const canvas = document.getElementById(id), ctx = canvas.getContext('2d');
  const platform = { createImage: () => {
    const image = new Image(), descriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    Object.defineProperty(image, 'src', { get() { return descriptor.get.call(this); },
      set(value) { descriptor.set.call(this, /^(https?:|\/)/.test(value) ? value : `../${value}`); } });
    return image;
  }, notify: () => {}, friendBoard: null };
  const controller = { platform, friendsTab: tab,
    worldBoard: { state: 'ready', rows: [
      { rank: 1, completed: 100, nickname: '阳光小镇', isMe: false },
      { rank: 2, completed: 94, nickname: '草莓泡芙', isMe: false },
      { rank: 3, completed: 87, nickname: '奇妙探险家', isMe: false },
      { rank: 4, completed: 81, nickname: '一个很长的测试玩家昵称', isMe: false },
      { rank: 5, completed: 76, nickname: '我', isMe: true },
    ] }, loadWorldLeaderboard() {} };
  const page = new FriendsPage(controller, () => {});
  const viewport = createViewport({ width, height, safeTop: 42, safeBottom: 14, pixelRatio: devicePixelRatio });
  page.resize(viewport);
  const draw = () => { ctx.setTransform(viewport.scale, 0, 0, viewport.scale, viewport.offsetX, 0); page.render(ctx, performance.now()/1000); requestAnimationFrame(draw); };
  draw();
}
mount('large',414,896,'world'); mount('small',320,568,'friends');
</script>
