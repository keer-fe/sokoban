<!doctype html><meta charset="utf-8"><style>body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="atlas" width="736" height="416"></canvas>
<script type="module">
const image=new Image();image.src='/output/imagegen/home-scene-v2/hero-articulated-source-v3.png';await image.decode();
const ctx=document.querySelector('canvas').getContext('2d');
// One identical isotropic scale for every pose. Translation aligns the glove contact only.
const palms=[[399,274],[839,276],[1284,278],[1727,280],[400,715],[840,716],[1285,720],[1728,721]];
for(let frame=0;frame<8;frame++){
 const col=frame%4,row=Math.floor(frame/4),[px,py]=palms[frame];
 ctx.save();ctx.beginPath();ctx.rect(col*184,row*208,184,208);ctx.clip();
 ctx.translate(col*184+162,row*208+143);ctx.scale(.46,.46);ctx.translate(-px,-py);
 const sx=Math.round(col*image.width/4),sy=Math.round(row*image.height/2);
 const sw=Math.round((col+1)*image.width/4)-sx,sh=Math.round((row+1)*image.height/2)-sy;
 ctx.drawImage(image,sx,sy,sw,sh,sx,sy,sw,sh);ctx.restore();
}
window.__bakeReady=true;
</script>
