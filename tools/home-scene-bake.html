<!doctype html><meta charset="utf-8"><title>首页原稿分层烘焙</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="base" width="860" height="660"></canvas>

<script type="module">
import { HOME_SCENE } from '/src/pages/home/scene-animation.js';
const load = src => new Promise((resolve,reject) => {const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src;});
const [master,clean,light] = await Promise.all([
  load('/images/visual-v1/reference/首页视觉母版.png'),
  load('/output/imagegen/home-scene-v2/hero-clean-plate.png'),
  load('/output/imagegen/home-scene-v2/light-clean-plate.png'),
]);
const silhouette = [[347,655],[356,644],[371,636],[388,633],[409,640],[423,649],
 [437,650],[444,658],[445,669],[455,677],[457,688],[448,701],[443,708],
 [449,713],[453,714],[453,720],[447,725],[443,734],[437,741],
 [443,743],[445,748],[449,751],[449,756],[445,758],[449,763],[446,768],
 [439,773],[423,774],[414,772],[400,776],[400,786],[411,787],[420,794],
 [422,804],[417,811],[405,815],[391,815],[379,810],[375,802],[366,797],
 [349,788],[339,793],[325,794],[319,788],[319,773],[315,766],[307,761],
 [302,754],[299,741],[303,730],[307,725],[306,716],[313,706],[323,701],
 [335,700],[339,693],[340,677],[343,664]];
function path(ctx, points){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();}
const base = document.querySelector('#base'), b = base.getContext('2d');
b.translate(-HOME_SCENE.x,-HOME_SCENE.y);
// Irregular silhouette follows foliage and contact shadow; no rectangular meadow cutout.
const boundary = [[174,517],[177,480],[214,442],[254,438],[301,456],[337,474],
 [363,464],[420,465],[490,478],[519,489],[570,486],[615,485],[652,466],
 [680,454],[719,460],[750,480],[766,520],[766,553],[791,583],[820,611],
 [828,657],[839,703],[840,751],[836,797],[857,831],[880,859],[903,895],
 [900,934],[881,955],[874,991],[859,1028],[878,1055],[871,1084],[841,1094],
 [802,1082],[762,1071],[731,1054],[683,1048],[642,1054],[592,1042],
 [537,1046],[490,1031],[435,1028],[379,1019],[334,1004],[288,995],
 [243,984],[200,991],[167,981],[132,966],[105,952],[83,921],[66,888],
 [61,850],[72,816],[91,783],[89,751],[105,718],[119,684],[124,649],
 [139,618],[146,584],[151,548]];
b.save();path(b,boundary);b.clip();b.drawImage(master,0,0,941,1672);
// New poses expose more of the floor: restore the full original character envelope.
const restoration=document.createElement('canvas');restoration.width=941;restoration.height=1672;
const r=restoration.getContext('2d');r.drawImage(clean,0,0,941,1672);
r.globalCompositeOperation='destination-in';r.filter='blur(4px)';r.fillStyle='#fff';
r.fillRect(294,628,166,195);b.drawImage(restoration,0,0);
// The restored air above the target is separate from the static target tile.
const patch=document.createElement('canvas');patch.width=941;patch.height=1672;
const p=patch.getContext('2d');p.drawImage(light,0,0,941,1672);
p.globalCompositeOperation='destination-in';
const fade=p.createRadialGradient(653,742,34,653,742,65);
fade.addColorStop(0,'#fff');fade.addColorStop(1,'#fff0');p.fillStyle=fade;p.fillRect(585,677,137,107);
b.drawImage(patch,0,0);b.restore();
// Feather only the outer extraction edge; inner stones and character pixels stay sharp.
const edge=document.createElement('canvas');edge.width=860;edge.height=660;
const e=edge.getContext('2d');e.translate(-45,-435);e.filter='blur(5px)';
e.fillStyle='#fff';path(e,boundary);e.fill();
b.save();b.setTransform(1,0,0,1,0,0);b.globalCompositeOperation='destination-in';
b.drawImage(edge,0,0);b.restore();
window.__bakeReady=true;
</script>
