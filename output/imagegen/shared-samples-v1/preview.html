<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共组件样件检查</title><style>body{margin:0;padding:28px;font:16px system-ui;background:#edf0e8;color:#23432e}h1{font-size:24px}header{margin-bottom:24px}label{display:block;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{padding:16px;background:white;border-radius:12px;overflow:auto}.stage{padding:18px;display:flex;justify-content:center;align-items:center;margin:8px 0;min-height:110px}.light{background:#fff3d7}.dark{background:#173b2a}.checker{background:conic-gradient(#ddd 25%,#fff 0 50%,#ddd 0 75%,#fff 0) 0 0/16px 16px}canvas{flex-shrink:0}p{line-height:1.6}.panel{margin-top:20px}.panel .stage{display:inline-flex;vertical-align:top}button{padding:6px 15px}small{color:#637567}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style><header><h1>公共组件样件检查</h1><p>候选素材原件不变。按 alpha ≥ 128 的主体边界统一显示宽度，外围阴影保留。这里只检查素材，不代表微信运行效果。</p><label>按钮主体宽度 <input id="size" type="range" min="140" max="320" value="240"> <output id="value">240</output> px</label><small>每列依次为奶油底、深绿底、透明棋盘底。文字仅为预览叠加。</small></header><div class="grid" id="buttons"></div><div class="card panel"><h2>面板 · 保持原比例</h2><div id="panel"></div><p>边缘检测：最外圈最大 alpha=1/255；正式导出前需清理极淡边缘像素并复核阴影。九宫格拉伸尚未验证。</p></div><script>
const samples=[['暖黄主按钮','button-primary-candidate-v1.png',[170,181,1812,622],'开始游戏'],['奶油次按钮','button-secondary-candidate-v1.png',[221,130,1913,609],'返回'],['浅蓝按钮','button-blue-candidate-v1.png',[111,112,1918,658],'排行榜']];
const loaded=[];
function draw(host,img,bounds,width,text){host.replaceChildren();for(const bg of ['light','dark','checker']){const stage=document.createElement('div');stage.className='stage '+bg;const c=document.createElement('canvas');const scale=width/(bounds[2]-bounds[0]);const w=img.width*scale,h=img.height*scale;const dpr=devicePixelRatio||1;c.width=Math.ceil(w*dpr);c.height=Math.ceil(h*dpr);c.style.width=w+'px';c.style.height=h+'px';const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.drawImage(img,0,0,w,h);if(text){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 20px system-ui';ctx.fillStyle='#245a36';ctx.fillText(text,(bounds[0]+bounds[2])*scale/2,(bounds[1]+bounds[3])*scale/2)}stage.append(c);host.append(stage)}}
async function init(){for(const [title,src,bounds,text] of samples){const card=document.createElement('div');card.className='card';const heading=document.createElement('h2');heading.textContent=title;const host=document.createElement('div');card.append(heading,host);document.querySelector('#buttons').append(card);const img=new Image();img.src=src;await img.decode();loaded.push({host,img,bounds,text})}const img=new Image();img.src='panel-modal-candidate-v1.png';await img.decode();draw(document.querySelector('#panel'),img,[71,102,1075,1267],260,'');render()}
function render(){const width=Number(document.querySelector('#size').value);document.querySelector('#value').value=width;for(const s of loaded)draw(s.host,s.img,s.bounds,width,s.text)}
document.querySelector('#size').oninput=render;init().catch(e=>{document.body.append('图片加载失败：'+e.message)});
</script></html>
