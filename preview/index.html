<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>推箱子 · 游戏预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #5C94FC; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #toast { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
      padding: 14px 22px; border-radius: 8px; background: #000c; color: white;
      font: 15px sans-serif; white-space: nowrap; pointer-events: none; }
    #toast:empty { display: none; }
  </style>
</head>
<body>
  <canvas aria-label="推箱子游戏画布"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/preview/main.js"></script>
</body>
</html>
