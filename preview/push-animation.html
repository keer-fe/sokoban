<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>推箱动画逐帧检查</title>
<style>
  body { margin: 24px; background: #e9f4e4; color: #263c25; font: 16px system-ui; }
  #frames { display: grid; grid-template-columns: repeat(4, 220px); gap: 12px; }
  canvas { background: #fff; border: 1px solid #a7b99f; max-width: 100%; }
</style>
<h1>推箱动画逐帧检查</h1>
<div id="frames"></div>
<h2>连续播放</h2>
<canvas id="live" width="440" height="170"></canvas>
<script type="module">
  import { loadHomeIcons } from '/src/ui/home-icons.js';
  import { drawLoadingPushAnimation } from '/src/pages/home/push-animation.js';
  async function setup(canvas) {
    const ctx = canvas.getContext('2d');
    const images = [];
    loadHomeIcons(ctx, { createImage() {
      const image = new Image();
      const ready = new Promise((resolve, reject) => {
        image.addEventListener('load', resolve);
        image.addEventListener('error', reject);
      });
      ready.catch(() => {});
      images.push({ image, ready });
      return image;
    } });
    await Promise.all(images.filter(({ image }) => image.src.includes('/assets/'))
      .map(({ ready }) => ready));
    // Let loadHomeIcons' onload handlers commit readiness before the snapshot.
    await new Promise(requestAnimationFrame);
    return ctx;
  }
  function draw(ctx, time, label) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.fillStyle = '#e0c595';
    ctx.fillRect(0, 130, ctx.canvas.width, 40);
    drawLoadingPushAnimation(ctx, ctx.canvas.width / 2, 130, time);
    ctx.fillStyle = '#263c25';
    ctx.font = '14px system-ui';
    ctx.fillText(label, 10, 20);
  }
  for (let frame = 0; frame < 8; frame++) {
    const canvas = document.createElement('canvas');
    canvas.width = 220; canvas.height = 170;
    document.querySelector('#frames').append(canvas);
    draw(await setup(canvas), frame / 8, `第 ${frame + 1} 帧`);
  }
  const live = await setup(document.querySelector('#live'));
  function tick(ms) { draw(live, ms / 1000, '8 帧循环'); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
</script>
</html>
